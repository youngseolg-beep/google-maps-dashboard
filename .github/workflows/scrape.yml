name: scrape-and-update

on:
  workflow_dispatch:
    inputs:
      status_only:
        description: "Supabase 연결 및 설정만 빠르게 검증"
        required: true
        default: false
        type: boolean

      repair_only:
        description: "Supabase 리뷰 중복 후보 및 review_key 읽기 전용 점검"
        required: true
        default: false
        type: boolean

      target_store:
        description: "단일 매장 검증용 정확한 store_name (비우면 전체 정기 크롤과 동일)"
        required: false
        default: ""
        type: string

      sort_diagnostics:
        description: "정렬 버튼/팝업의 제한된 스크린샷 및 DOM 메타데이터 artifact 생성"
        required: false
        default: false
        type: boolean

  schedule:
    - cron: "0 22 * * *"

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scraper/requirements.txt
          playwright install --with-deps chromium

      - name: Run scraper and save to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STATUS_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.status_only || false }}
          REPAIR_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.repair_only || false }}
          TARGET_STORE: ${{ github.event_name == 'workflow_dispatch' && inputs.target_store || '' }}
          SORT_DIAGNOSTICS: ${{ github.event_name == 'workflow_dispatch' && inputs.sort_diagnostics || false }}
          SORT_DIAGNOSTIC_DIR: sort-diagnostics

        run: |
          echo "Event: ${{ github.event_name }}"
          echo "STATUS_ONLY: ${STATUS_ONLY}"
          echo "REPAIR_ONLY: ${REPAIR_ONLY}"
          echo "TARGET_STORE: ${TARGET_STORE:-<all stores>}"
          echo "SORT_DIAGNOSTICS: ${SORT_DIAGNOSTICS}"
          python scraper/scraper.py

      - name: Upload Google Maps sort diagnostics
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.sort_diagnostics }}
        uses: actions/upload-artifact@v4
        with:
          name: google-maps-sort-diagnostics-${{ github.run_id }}
          path: sort-diagnostics
          if-no-files-found: warn
          retention-days: 7
